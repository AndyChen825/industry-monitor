<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>台灣產業趨勢監測與公司情報系統</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 深色主題 — 色彩取自驗證通過之深色調色盤 */
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232322;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,0.10);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  }
  * { box-sizing: border-box; }
  body { font-family: "Microsoft JhengHei", system-ui, "Segoe UI", sans-serif;
         margin: 0; background: var(--page); color: var(--ink-2); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 28px;
           background: var(--surface); border-bottom: 1px solid var(--border);
           position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; color: var(--ink); font-weight: 600; }
  header .spacer { flex: 1; }
  #updated { font-size: 12px; color: var(--muted); }
  .btn { padding: 8px 14px; border-radius: 8px; font-size: 14px; cursor: pointer;
         border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); }
  .btn:hover { background: #2e2e2c; }
  .btn.primary { background: var(--c1); border-color: transparent; }
  .btn.primary:hover { background: #2a78d6; }
  .btn.home { background: transparent; border-color: var(--c1); color: var(--c1); font-weight: 600; }
  .btn.home:hover { background: rgba(57,135,229,0.12); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 28px;
         background: var(--surface); border-bottom: 1px solid var(--border); }
  .bar label { font-size: 13px; color: var(--muted); }
  select, input { padding: 8px 10px; border: 1px solid var(--grid); border-radius: 8px;
                  font-size: 14px; background: var(--page); color: var(--ink); }
  input::placeholder { color: var(--muted); }
  main { padding: 22px 28px; max-width: 1280px; margin: 0 auto; }
  #status { font-size: 13px; color: var(--muted); margin: 0 0 12px; min-height: 18px; }
  .viz-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 14px; margin-bottom: 18px; }
  @media (max-width: 900px) { .viz-grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border);
           border-radius: 12px; padding: 16px 18px; }
  .panel h2 { margin: 0 0 4px; font-size: 15px; color: var(--ink); font-weight: 600; }
  .panel .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  #treemap { width: 100%; height: 340px; position: relative; }
  .tm-block { position: absolute; border-radius: 6px; cursor: pointer; overflow: hidden;
              outline: 2px solid var(--surface); transition: filter .12s; }
  .tm-block:hover { filter: brightness(1.18); }
  .tm-label { position: absolute; left: 7px; top: 5px; right: 6px; line-height: 1.35; }
  /* 公司樹狀圖:文字置中版 */
  .tm-block.tm-center { display: flex; align-items: center; justify-content: center;
                        text-align: center; border: 1px solid rgba(16,185,129,0.45); }
  .tm-block.tm-center .tm-label { position: static; left: auto; top: auto; right: auto; padding: 0 6px; }
  .tm-quote { display: block; font-size: 11px; font-weight: 700; margin-top: 1px; }
  .tm-name { font-size: 12px; font-weight: 600; display: block;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tm-count { font-size: 11px; opacity: .82; }
  #wordcloud { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
               gap: 6px 14px; min-height: 340px; padding: 8px 4px; align-content: center; }
  .wc-word { cursor: pointer; line-height: 1.25; transition: filter .12s; }
  .wc-word:hover { filter: brightness(1.3); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 13px;
          border-radius: 16px; font-size: 13px; cursor: pointer;
          background: var(--surface); border: 1px solid var(--border); color: var(--ink-2); }
  .chip:hover { background: var(--surface-2); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .chip.active { background: var(--surface-2); border-color: var(--ink-2); color: var(--ink); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-left: 4px solid var(--grid); border-radius: 10px;
          padding: 13px 16px; margin-bottom: 9px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { color: var(--c1); }
  .meta { font-size: 12px; color: var(--muted); }
  .summary { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
  .tag { display: inline-block; font-size: 11px; border-radius: 4px; padding: 2px 8px;
         margin-left: 8px; background: var(--surface-2); color: var(--ink-2);
         border: 1px solid var(--border); }
  .note { font-size: 12px; color: #fab219; background: rgba(250,178,25,0.08);
          border: 1px solid rgba(250,178,25,0.3); border-radius: 8px;
          padding: 9px 13px; margin: 8px 0; }
  h2.section { font-size: 16px; color: var(--ink); margin: 20px 0 10px; }
  h3.section { font-size: 14px; color: var(--ink); margin: 16px 0 8px; }
  .hidden { display: none; }
  #tooltip { position: fixed; pointer-events: none; z-index: 99; display: none;
             background: #000; color: var(--ink); border: 1px solid var(--border);
             border-radius: 8px; padding: 8px 11px; font-size: 12px; line-height: 1.5;
             max-width: 260px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
  #tooltip .t-title { color: var(--ink); font-weight: 600; }
  #tooltip .t-sub { color: var(--ink-2); }
  .report-list a { color: var(--c1); }
</style>
</head>
<body>
<header>
  <h1>台灣產業趨勢監測與公司情報系統</h1>
  <span id="updated"></span>
  <span class="spacer"></span>
  <button class="btn home" onclick="goHome()">⌂ 回到首頁</button>
</header>

<div class="bar">
  <label>期間</label>
  <select id="period" onchange="onPeriodChange()">
    <option value="7d">近 7 天</option>
    <option value="30d">近 30 天</option>
    <option value="90d">近 90 天</option>
    <option value="ytd">今年迄今 (YTD)</option>
    <option value="custom">自訂</option>
  </select>
  <span id="customRange" class="hidden">
    <input type="date" id="start" onchange="loadOverview()"> ~
    <input type="date" id="end" onchange="loadOverview()">
  </span>
  <input type="text" id="company" placeholder="公司名稱關鍵字(公司搜尋)" size="24">
  <button class="btn primary" onclick="searchCompany()">公司搜尋</button>
  <button class="btn" onclick="browseIndustries()">產業瀏覽</button>
  <button class="btn" onclick="showReports()">下載週報</button>
</div>

<main>
  <div id="status"></div>
  <div id="dashboard">
    <div class="viz-grid">
      <div class="panel" id="industryPanel">
        <h2>產業聲量樹狀圖</h2>
        <div class="sub">面積與顏色深淺 = 期間內可歸類報導篇數;點擊區塊可篩選該產業</div>
        <div id="treemap"></div>
      </div>
      <div class="panel" id="wcPanel">
        <h2>熱門關鍵字文字雲</h2>
        <div class="sub" id="wcSub">字體大小 = 期間內提及該詞之報導篇數;顏色 = 該詞最常出現的產業</div>
        <div id="wordcloud"></div>
      </div>
    </div>
    <div class="panel" id="companyPanel" style="margin-bottom:18px">
      <h2 id="cpTitle">公司聲量樹狀圖</h2>
      <div class="sub" id="cpSub"></div>
      <div id="companyTreemap" style="width:100%;height:300px;position:relative"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div id="content"></div>
</main>

<div id="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
let currentIndustry = "";
let ALL = [];        // 全部文章
let KEYWORDS = {};   // 各預設期間關鍵字
let META = {};

const INDUSTRIES = [
  "高科技製造業","傳統製造業","批發零售業","住宿及餐飲業","資通訊業","金融業",
  "保險業","專業科學及技術服務業","政府教育單位","醫療保健業","服務業",
];
const INDUSTRY_COLORS = {
  "高科技製造業": "var(--c1)", "金融業": "var(--c2)", "資通訊業": "var(--c3)",
  "政府教育單位": "var(--c4)", "醫療保健業": "var(--c5)", "傳統製造業": "var(--c6)",
  "批發零售業": "var(--c7)", "服務業": "var(--c8)",
  "保險業": "#898781", "住宿及餐飲業": "#898781", "專業科學及技術服務業": "#898781",
};
const SEQ = ["#86b6ef","#6da7ec","#5598e7","#3987e5","#2a78d6","#256abf","#1c5cab","#184f95"];
/* 公司樹狀圖:股票行情風格 — 單一綠色以透明度深淺表示聲量 */
const COMPANY_GREEN = t => `rgba(16,185,129,${(0.15 + t * 0.78).toFixed(2)})`;
const FINDBIZ_URL = "https://findbiz.nat.gov.tw/fts/query/QueryBar/queryInit.do";

/* ---------- 期間解析(瀏覽器端) ---------- */
function fmt(d) { return d.toISOString().slice(0, 10); }
function resolvePeriod() {
  const p = $("period").value;
  const now = new Date();
  const end = fmt(now);
  if (p === "ytd") return [now.getFullYear() + "-01-01", end];
  if (p === "custom") return [$("start").value || "1970-01-01", $("end").value || end];
  const days = parseInt(p);
  const s = new Date(now.getTime() - days * 86400000);
  return [fmt(s), end];
}
function onPeriodChange() {
  $("customRange").classList.toggle("hidden", $("period").value !== "custom");
  if ($("period").value !== "custom") loadOverview();
}
function browseIndustries() {
  // 重設產業篩選回「全部」,確保點擊後必有視覺變化(產業樹狀圖重新出現)
  currentIndustry = "";
  loadOverview();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  currentIndustry = "";
  $("period").value = "7d";
  $("customRange").classList.add("hidden");
  $("company").value = "";
  loadOverview();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- tooltip ---------- */
const tip = $("tooltip");
function showTip(ev, html) { tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev) {
  const pad = 14; let x = ev.clientX + pad, y = ev.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }

/* ---------- 資料載入(靜態 JSON,一次載入後全在瀏覽器端運算) ---------- */
async function initData() {
  $("status").textContent = "載入資料中…";
  const [a, k, m] = await Promise.all([
    fetch("data/articles.json").then(r => r.json()),
    fetch("data/keywords.json").then(r => r.json()),
    fetch("data/meta.json").then(r => r.json()),
  ]);
  ALL = a; KEYWORDS = k; META = m;
  $("updated").textContent = "資料更新:" + (m.generated_at || "").slice(0, 16).replace("T", " ");
  loadOverview();
}

function filterArticles(startS, endS, industry, keyword) {
  const endFull = endS + "T23:59:59";
  return ALL.filter(x =>
    x.published_at >= startS && x.published_at <= endFull &&
    (!industry || x.industry === industry) &&
    (!keyword || x.title.includes(keyword) || (x.summary || "").includes(keyword) ||
     (x.source || "").includes(keyword)));
}

function loadOverview() {
  $("dashboard").style.display = "";
  const [s, e] = resolvePeriod();
  const arts = filterArticles(s, e, currentIndustry, "");
  const counts = {};
  for (const a of filterArticles(s, e, "", "")) {
    if (a.industry) counts[a.industry] = (counts[a.industry] || 0) + 1;
  }
  $("status").textContent = `期間 ${s} ~ ${e},共 ${arts.length} 筆` +
    (currentIndustry ? `(篩選:${currentIndustry})` : "");
  renderChips(counts);
  // 已篩選單一產業時,產業占比圖無意義 → 隱藏,文字雲改為全寬
  if (currentIndustry) {
    $("industryPanel").style.display = "none";
    $("wcPanel").style.gridColumn = "1 / -1";
  } else {
    $("industryPanel").style.display = "";
    $("wcPanel").style.gridColumn = "";
    renderTreemap(counts);
  }
  renderCompanyTreemap(filterArticles(s, e, "", ""));
  renderWordcloud();
  $("content").innerHTML = arts.slice(0, 300).map(cardHTML).join("") ||
    "<p>此期間尚無資料。</p>";
}
function pick(i) { currentIndustry = i; loadOverview(); }

function renderChips(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const chips = [
    `<span class="chip ${currentIndustry === "" ? "active" : ""}" onclick="pick('')">
       <span class="dot" style="background:var(--ink-2)"></span>全部 (${total})</span>`,
  ].concat(INDUSTRIES.map(i =>
    `<span class="chip ${currentIndustry === i ? "active" : ""}" onclick="pick('${i}')">
       <span class="dot" style="background:${INDUSTRY_COLORS[i] || "var(--muted)"}"></span>
       ${i} (${counts[i] || 0})</span>`));
  $("chips").innerHTML = chips.join("");
}

/* ---------- 樹狀圖 ---------- */
function renderTreemap(counts) {
  const el = $("treemap");
  el.innerHTML = "";
  const data = Object.entries(counts).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  if (!data.length) {
    el.innerHTML = "<p style='color:var(--muted);font-size:13px'>此期間無可歸類資料。</p>";
    return;
  }
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 120) { setTimeout(() => renderTreemap(counts), 200); return; }
  const total = data.reduce((s, [, v]) => s + v, 0);
  const max = data[0][1], min = data[data.length - 1][1];
  const rects = squarify(data.map(([k, v]) => ({ key: k, value: v })), 0, 0, W, H);
  for (const r of rects) {
    const t = max === min ? 1 : (r.item.value - min) / (max - min);
    const fill = SEQ[Math.round(t * (SEQ.length - 1))];
    const dark = t > 0.45;
    const div = document.createElement("div");
    div.className = "tm-block";
    div.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${fill};`;
    const pct = (r.item.value / total * 100).toFixed(1);
    if (r.w > 66 && r.h > 34) {
      div.innerHTML = `<span class="tm-label" style="color:${dark ? "#fff" : "#0b0b0b"}">
        <span class="tm-name">${r.item.key}</span>
        <span class="tm-count">${r.item.value} 篇</span></span>`;
    }
    div.onmousemove = ev => showTip(ev,
      `<div class="t-title">${r.item.key}</div>
       <div class="t-sub">${r.item.value} 篇報導 · 佔 ${pct}%</div>
       <div class="t-sub">點擊可篩選此產業</div>`);
    div.onmouseleave = hideTip;
    div.onclick = () => { hideTip(); pick(r.item.key); };
    el.appendChild(div);
  }
}
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, it) => s + it.value, 0);
  let rest = items.slice(), rx = x, ry = y, rw = w, rh = h, restVal = total;
  while (rest.length) {
    const horizontal = rw >= rh;
    const side = horizontal ? rh : rw;
    let row = [rest[0]], rowVal = rest[0].value;
    const area = v => v / restVal * rw * rh;
    const worst = rv => {
      const len = rv / restVal * rw * rh / side;
      let worstRatio = 0;
      for (const it of row) {
        const cell = area(it.value) / len;
        worstRatio = Math.max(worstRatio, Math.max(len / cell, cell / len));
      }
      return worstRatio;
    };
    let cur = worst(rowVal);
    for (let i = 1; i < rest.length; i++) {
      row.push(rest[i]);
      const nv = rowVal + rest[i].value;
      const nw = worst(nv);
      if (nw > cur) { row.pop(); break; }
      rowVal = nv; cur = nw;
    }
    const len = rowVal / restVal * rw * rh / side;
    let off = 0;
    for (const it of row) {
      const cell = (it.value / rowVal) * side;
      out.push(horizontal
        ? { item: it, x: rx, y: ry + off, w: len, h: cell }
        : { item: it, x: rx + off, y: ry, w: cell, h: len });
      off += cell;
    }
    if (horizontal) { rx += len; rw -= len; } else { ry += len; rh -= len; }
    rest = rest.slice(row.length);
    restVal = rest.reduce((s, it) => s + it.value, 0) || 1;
  }
  return out;
}

/* ---------- 公司聲量樹狀圖(依產業觀察清單,別名比對) ---------- */
function aliasMatcher(aliases) {
  const zh = aliases.filter(a => /[一-鿿]/.test(a));
  const latin = aliases.filter(a => !/[一-鿿]/.test(a))
    .map(a => new RegExp("(^|[^A-Za-z0-9])" + a.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "([^A-Za-z0-9]|$)", "i"));
  return text => zh.some(a => text.includes(a)) || latin.some(re => re.test(text));
}

function renderCompanyTreemap(periodArticles) {
  const panel = $("companyPanel");
  const el = $("companyTreemap");
  const wl = META.watchlist || {};
  const industry = wl[currentIndustry] ? currentIndustry
    : (wl["高科技製造業"] ? "高科技製造業" : Object.keys(wl)[0]);
  if (!industry) { panel.style.display = "none"; return; }
  panel.style.display = "";
  $("cpTitle").textContent = `公司聲量樹狀圖 — ${industry}`;
  $("cpSub").textContent =
    "依全體上市櫃公司名錄+自訂品牌清單,自動比對期間內報導之標題與內容,統計各公司被提及篇數" +
    "(顯示前 15 大,其餘合併為「其他」);上市櫃公司附最近收盤價與漲跌幅(漲紅跌綠,每日更新時同步)。" +
    "點擊區塊可查看該公司相關報導。同名詞彙可能造成少量誤計。";
  el.innerHTML = "";
  const counts = {};
  const matchers = Object.entries(wl[industry]).map(([name, aliases]) =>
    [name, aliasMatcher(aliases)]);
  for (const a of periodArticles) {
    const text = a.title + " " + (a.summary || "") + " " + (a.source || "");
    for (const [name, match] of matchers) {
      if (match(text)) counts[name] = (counts[name] || 0) + 1;
    }
  }
  let data = Object.entries(counts).sort((x, y) => y[1] - x[1]);
  if (!data.length) {
    el.innerHTML = "<p style='color:var(--muted);font-size:13px'>此期間報導中未偵測到已知公司名稱(多為不含特定公司之產業新聞)。</p>";
    return;
  }
  // 前 15 大之外合併為「其他」,避免大量無法標示文字的細小區塊。
  // 「其他」的面積固定為最小格(不依實際合計篇數,避免壓過主要公司)。
  const trueTotal = Object.values(counts).reduce((a, b) => a + b, 0);
  const TOP_N = 15;
  let restInfo = null;
  if (data.length > TOP_N) {
    const rest = data.slice(TOP_N);
    restInfo = { count: rest.length, sum: rest.reduce((s, [, v]) => s + v, 0),
                 names: rest.slice(0, 8).map(([k]) => k) };
    data = data.slice(0, TOP_N);
    data.push(["__other__", Math.max(1, Math.round(data[data.length - 1][1] * 0.8))]);
  }
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 120) { setTimeout(() => renderCompanyTreemap(periodArticles), 200); return; }
  const vals = data.filter(([k]) => k !== "__other__").map(([, v]) => v);
  const max = vals[0], min = vals[vals.length - 1];
  const rects = squarify(data.map(([k, v]) => ({ key: k, value: v })), 0, 0, W, H);
  for (const r of rects) {
    const isOther = r.item.key === "__other__";
    const label = isOther ? `其他(${restInfo.count}家)` : r.item.key;
    const t = max === min ? 1 : (r.item.value - min) / (max - min);
    const div = document.createElement("div");
    div.className = "tm-block tm-center";
    div.style.cssText =
      `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;` +
      (isOther
        ? "background:rgba(137,135,129,0.18);border-color:rgba(137,135,129,0.4);cursor:default;"
        : `background:${COMPANY_GREEN(t)};`);
    const displayCount = isOther ? restInfo.sum : r.item.value;
    const pct = (displayCount / trueTotal * 100).toFixed(1);
    const q = isOther ? null : (META.quotes || {})[r.item.key];
    if (r.w > 50 && r.h > 26) {
      let quoteHtml = "";
      if (q && r.h > 46) {   // 台股慣例:漲紅跌綠
        const qc = q.pct > 0 ? "#ff8585" : (q.pct < 0 ? "#7ee2b8" : "#c3c2b7");
        const arrow = q.pct > 0 ? "▲" : (q.pct < 0 ? "▼" : "–");
        quoteHtml = `<span class="tm-quote" style="color:${qc}">
          ${q.close} ${arrow}${Math.abs(q.pct).toFixed(2)}%</span>`;
      }
      div.innerHTML = `<span class="tm-label" style="color:${isOther ? "var(--ink-2)" : "#fff"}">
        <span class="tm-name">${label}</span>
        <span class="tm-count">${displayCount} 篇</span>${quoteHtml}</span>`;
    }
    if (isOther) {
      div.onmousemove = ev => showTip(ev,
        `<div class="t-title">其他 ${restInfo.count} 家</div>
         <div class="t-sub">合計 ${restInfo.sum} 篇(面積不代表篇數)</div>
         <div class="t-sub">${restInfo.names.join("、")}${restInfo.count > 8 ? "…" : ""}</div>`);
      div.onmouseleave = hideTip;
    } else {
      const quoteTip = q
        ? `<div class="t-sub">股價 ${q.close}(${q.pct > 0 ? "+" : ""}${q.pct.toFixed(2)}%,最近收盤)· 代號 ${q.code}</div>`
        : "";
      div.onmousemove = ev => showTip(ev,
        `<div class="t-title">${label}</div>
         <div class="t-sub">${r.item.value} 篇報導提及 · 佔清單公司總聲量 ${pct}%</div>` +
        quoteTip +
        `<div class="t-sub">點擊查看相關報導</div>`);
      div.onmouseleave = hideTip;
      div.onclick = () => {
        hideTip();
        $("company").value = label;
        searchCompany();
      };
    }
    el.appendChild(div);
  }
}

/* ---------- 文字雲(預先計算之預設期間詞頻) ---------- */
function renderWordcloud() {
  const el = $("wordcloud");
  el.innerHTML = "";
  const p = $("period").value;
  if (p === "custom") {
    el.innerHTML = "<p style='color:var(--muted);font-size:13px'>文字雲僅支援預設期間(近 7/30/90 天、YTD)。</p>";
    return;
  }
  const group = KEYWORDS[p] || {};
  // 相容舊版格式(陣列 = 全產業);新版為 {all, 各產業} 分組
  const words = Array.isArray(group) ? group : (group[currentIndustry || "all"] || []);
  $("wcSub").textContent = "字體大小 = 期間內提及該詞之報導篇數;顏色 = 該詞最常出現的產業" +
    `(統計範圍:${currentIndustry || "全部產業"};點擊詞彙可查看相關報導)`;
  if (!words.length) {
    el.innerHTML = "<p style='color:var(--muted);font-size:13px'>此期間該產業無足夠資料。</p>";
    return;
  }
  const max = words[0].count, min = words[words.length - 1].count;
  for (const w of words) {
    const t = max === min ? 1 : (w.count - min) / (max - min);
    const size = Math.round(13 + Math.sqrt(t) * 30);
    const color = w.industry ? (INDUSTRY_COLORS[w.industry] || "var(--ink-2)") : "var(--ink-2)";
    const span = document.createElement("span");
    span.className = "wc-word";
    span.style.cssText = `font-size:${size}px;color:${color};font-weight:${t > 0.5 ? 700 : 500};`;
    span.textContent = w.word;
    span.onmousemove = ev => showTip(ev,
      `<div class="t-title">${w.word}</div><div class="t-sub">${w.count} 篇報導提及</div>` +
      (w.industry ? `<div class="t-sub">主要出現於:${w.industry}</div>` : "") +
      `<div class="t-sub">點擊查看相關報導</div>`);
    span.onmouseleave = hideTip;
    span.onclick = () => { hideTip(); showKeywordResults(w.word); };
    el.appendChild(span);
  }
}

/* ---------- 文章卡片 ---------- */
function cardHTML(a) {
  const c = INDUSTRY_COLORS[a.industry] || "var(--grid)";
  return `<div class="card" style="border-left-color:${c}">
    <h3><a href="${a.url}" target="_blank" rel="noopener">${a.title}</a>
      ${a.industry ? `<span class="tag" style="color:${c};border-color:${c}">${a.industry}</span>` : ""}</h3>
    <div class="meta">${a.source} | ${(a.published_at || "日期不明").slice(0, 16)}</div>
    ${a.summary ? `<div class="summary">${a.summary.slice(0, 160)}…</div>` : ""}
  </div>`;
}

/* ---------- 關鍵字結果(文字雲點擊) ---------- */
function showKeywordResults(word) {
  $("dashboard").style.display = "none";
  const [s, e] = resolvePeriod();
  const news = filterArticles(s, e, "", word);
  let html = `<h2 class="section">關鍵字「${word}」相關報導(期間 ${s} ~ ${e},共 ${news.length} 筆)</h2>`;
  html += `<p style="font-size:13px;color:var(--muted)">點右上「⌂ 回到首頁」返回總覽。</p>`;
  html += news.slice(0, 200).map(cardHTML).join("") ||
    `<div class="note">資料不足:期間內無相關報導。</div>`;
  $("status").textContent = "";
  $("content").innerHTML = html;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- 公司搜尋(瀏覽器端關鍵字比對) ---------- */
function findWatchAliases(name) {
  for (const companies of Object.values(META.watchlist || {})) {
    if (companies[name]) return companies[name];
  }
  return null;
}

function searchCompany() {
  const name = $("company").value.trim();
  if (!name) { alert("請輸入公司名稱關鍵字"); return; }
  $("dashboard").style.display = "none";
  const [s, e] = resolvePeriod();
  let news;
  const aliases = findWatchAliases(name);
  if (aliases) {   // 觀察清單公司:以別名比對(中英文皆涵蓋)
    const match = aliasMatcher(aliases);
    const endFull = e + "T23:59:59";
    news = ALL.filter(x => x.published_at >= s && x.published_at <= endFull &&
      match(x.title + " " + (x.summary || "") + " " + (x.source || "")));
  } else {
    news = filterArticles(s, e, "", name);
  }
  let html = `<h2 class="section">公司情報:${name}(期間 ${s} ~ ${e})</h2>`;
  html += `<div class="note">商工登記資料(統編、登記地址、資本額、變更紀錄)請至
    <a href="${FINDBIZ_URL}" target="_blank" rel="noopener" style="color:#fab219">
    經濟部商工登記公示資料查詢服務</a> 查詢(該站含驗證碼,無法自動查詢)。</div>`;
  html += `<h3 class="section">相關報導(${news.length} 筆)</h3>`;
  html += news.slice(0, 200).map(cardHTML).join("") ||
    `<div class="note">資料不足:期間內無相關報導。</div>`;
  $("status").textContent = "";
  $("content").innerHTML = html;
}

/* ---------- 週報下載 ---------- */
function showReports() {
  $("dashboard").style.display = "none";
  const reports = META.reports || [];
  let html = `<h2 class="section">週報下載</h2>`;
  if (!reports.length) {
    html += `<div class="note">尚無已產出之週報。</div>`;
  } else {
    html += `<div class="card report-list">` + reports.map(f =>
      `<p>📄 <a href="reports/${encodeURIComponent(f)}" download>${f}</a></p>`).join("") + `</div>`;
  }
  const gaps = (META.fetch_status || []).filter(x => x.status !== "ok");
  if (gaps.length) {
    html += `<h3 class="section">資料缺口(最近一次更新)</h3>` +
      gaps.map(g => `<div class="note">${g.source}:${g.message || g.status}</div>`).join("");
  }
  $("content").innerHTML = html;
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(loadOverview, 300);
});

initData();
</script>
