name: weekly-update

on:
  schedule:
    # 以下均為台北時間(UTC+8)換算;Word 週報由 static_build.py 僅於週一產出
    - cron: "0 1 * * 1-5"    # 平日 09:00 開盤 — 更新新聞
    - cron: "0 4 * * *"      # 每天 12:00 — 例行更新
    - cron: "30 5 * * 1-5"   # 平日 13:30 收盤 — 更新新聞(當日收盤行情證交所須至傍晚才發布)
    - cron: "30 9 * * 1-5"   # 平日 17:30 — 取得當日收盤行情

  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動觸發

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 抓取各來源新資料(增量更新)
        run: python main.py fetch

      - name: 以最新規則重新歸類全部文章
        run: python main.py reclassify

      - name: 產出靜態網站與週報
        run: python static_build.py

      - name: 負面警示與來源健康通知(開 Issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python notify_alerts.py

      - name: 提交更新後的資料與網站
        run: |
          git config user.name "industry-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "無變更,略過提交"
          else
            git commit -m "自動更新:$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M') 台北時間"
            git push
          fi
