name: weekly-update

on:
  schedule:
    # 每天 12:00(台北時間,UTC+8)= 04:00 UTC 抓取資料;
    # Word 週報由 static_build.py 僅於週一產出
    - cron: "0 4 * * *"
    # 平日 17:30(台北)= 09:30 UTC 收盤後再更新一次,取得當日收盤行情
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}   # 允許在 GitHub 網頁上手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 抓取各來源新資料(增量更新)
        run: python main.py fetch

      - name: 產出靜態網站與週報
        run: python static_build.py

      - name: 提交更新後的資料與網站
        run: |
          git config user.name "industry-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "無變更,略過提交"
          else
            git commit -m "自動更新:$(date -u -d '+8 hours' +'%Y-%m-%d %H:%M') 台北時間"
            git push
          fi
